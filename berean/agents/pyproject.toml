[project]
name = "berean-agents"
version = "0.1.0"
description = "Project Berean's multi-agent system, built on ADK and deployed to the Gemini Enterprise Agent Platform."
requires-python = ">=3.11"
dependencies = [
    "google-adk[mcp]>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["berean_agents*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
