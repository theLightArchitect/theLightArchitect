[package]
name = "berean-engine"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing verbatim scripture retrieval, cross-reference graph, and lexicon lookups for Project Berean. Never returns a fabricated citation."

[dependencies]
anyhow = "1"
rmcp = { version = "0.16", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
